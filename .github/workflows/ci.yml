name: CI Pipeline

on:
  push:
    branches: [ main, stabilization-and-oauth ]
  pull_request:
    branches: [ main, stabilization-and-oauth ]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' || mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: Avtive-Profiles-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Avtive-Profiles-main/package-lock.json'

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run test suite
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/avtive_ci_test
          MONGODB_DB_NAME: avtive_ci_test
          SESSION_SECRET: test-session-secret-key-32-chars-long
          JWT_SECRET: test-session-secret-key-32-chars-long
          GOOGLE_CLIENT_ID: test-client-id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: test-client-secret
        run: npm test

      - name: Run production build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SESSION_SECRET: test-session-secret-key-32-chars-long
          JWT_SECRET: test-session-secret-key-32-chars-long
          MONGODB_URI: mongodb://localhost:27017/avtive_ci_test
          MONGODB_DB_NAME: avtive_ci_test
        run: npm run build
